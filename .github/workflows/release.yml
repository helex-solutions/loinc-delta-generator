name: Release

# Push a tag `v<version>` (e.g. v0.1.0) to publish loinc-delta-generator-<version>.jar and its
# SHA-256 as a GitHub release. Hosts download the pinned jar and verify the checksum.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: ./gradlew build --no-daemon -PreleaseVersion="${GITHUB_REF_NAME#v}"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          jar="build/libs/loinc-delta-generator-${version}.jar"
          (cd build/libs && sha256sum "loinc-delta-generator-${version}.jar" > "loinc-delta-generator-${version}.jar.sha256")
          gh release create "$GITHUB_REF_NAME" "$jar" "${jar}.sha256" --title "$GITHUB_REF_NAME" --generate-notes
